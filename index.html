<html lang="en">
<head>

</head>
<body>
    <script>
        let angka1=prompt("masukan angka");
        let angka2=prompt("masukan angka");
         function jumlah(){
             return angka1 ** angka2
         }
        let hasil=jumlah(angka1,angka2);
        document.write(jumlah(hasil));


        let angka=prompt("masukan angka");
        function cekganjilgenap(angka) {
        if (angka % 2 === 0){
           return "genap";
        } else {
           return "ganjil";
        }
        }

        alert(cekganjilgenap(number(angka)));
    </script>
</body>
